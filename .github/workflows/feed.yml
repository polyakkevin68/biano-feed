name: Biano feed frissítés

on:
  schedule:
    - cron: "15 */3 * * *"   # 3 óránként (a Biano 4 óránként tölt le)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Feed generálása
        run: |
          mkdir -p public
          python generate_feed.py -o public/biano_feed.xml --category "Masszázsfotel" --brand "HC Home" --min-products 5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
